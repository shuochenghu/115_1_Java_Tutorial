<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:696px;height:541px;background:#FFFFFF;" width="696px" height="541px" viewBox="0 0 696 541" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs><filter id="b16n1a0nxofkgo0" x="0" y="0" width="1" height="1"><feFlood flood-color="#FDE2E0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="b16n1a0nxofkgo1" x="0" y="0" width="1" height="1"><feFlood flood-color="#E3ECF8" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="163.228" y="25.06" fill="#000" font-size="14" textLength="362.544" font-weight="700" font-family="'Microsoft JhengHei'">本週會遇到的例外類別（都是 JDK 內建，java.lang 套件）</text></g><g class="legend" data-source-line="14"><rect x="394.424" y="51.621" width="282.576" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="399.424" y="71.681" fill="#000" font-size="14" textLength="196" font-family="'Microsoft JhengHei'" filter="url(#b16n1a0nxofkgo0)">　非受檢：編譯器不強制處理　</text><text x="399.424" y="90.302" fill="#000" font-size="14" textLength="272.576" font-family="'Microsoft JhengHei'" filter="url(#b16n1a0nxofkgo1)">　受檢：編譯器要求 catch 或宣告 throws　</text></g><!--class Throwable--><g class="entity" data-qualified-name="Throwable" id="ent0001" data-source-line="19"><rect x="277" y="123.863" width="85.211" height="31.281" fill="#F4F4F4" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="280" y="146.074" fill="#000" font-size="16" textLength="79.211" font-family="'Microsoft JhengHei'">Throwable</text></g><!--class Exception--><g class="entity" data-qualified-name="Exception" id="ent0002" data-source-line="20"><rect x="280" y="190.863" width="79.414" height="31.281" fill="#F4F4F4" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="283" y="213.074" fill="#000" font-size="16" textLength="73.414" font-family="'Microsoft JhengHei'">Exception</text></g><!--class RuntimeException--><g class="entity" data-qualified-name="RuntimeException" id="ent0003" data-source-line="21"><rect x="139" y="272.863" width="142.945" height="31.281" fill="#FDE2E0" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="142" y="295.074" fill="#000" font-size="16" textLength="136.945" font-family="'Microsoft JhengHei'">RuntimeException</text></g><!--class IllegalArgumentException--><g class="entity" data-qualified-name="IllegalArgumentException" id="ent0004" data-source-line="22"><rect x="12" y="354.863" width="202.805" height="60.563" fill="#FDE2E0" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="16.098" y="377.074" fill="#000" font-size="16" textLength="194.609" font-family="'Microsoft JhengHei'">IllegalArgumentException</text><line x1="13" y1="386.145" x2="213.805" y2="386.145" style="stroke:#555;stroke-width:0.5;"/><text x="18" y="407.355" fill="#000" font-size="16" textLength="190.805" font-family="'Microsoft JhengHei'">reserve 自己 throw（A2）</text></g><!--class NumberFormatException--><g class="entity" data-qualified-name="NumberFormatException" id="ent0005" data-source-line="25"><rect x="6" y="458.363" width="215.125" height="60.563" fill="#FDE2E0" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="18.68" y="480.574" fill="#000" font-size="16" textLength="189.766" font-family="'Microsoft JhengHei'">NumberFormatException</text><line x1="7" y1="489.645" x2="220.125" y2="489.645" style="stroke:#555;stroke-width:0.5;"/><text x="12" y="510.855" fill="#000" font-size="16" textLength="203.125" font-family="'Microsoft JhengHei'">Integer.parseInt 失敗時拋出</text></g><!--class ClassCastException--><g class="entity" data-qualified-name="ClassCastException" id="ent0006" data-source-line="28"><rect x="233.5" y="354.863" width="150.148" height="60.563" fill="#FDE2E0" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="236.5" y="377.074" fill="#000" font-size="16" textLength="144.148" font-family="'Microsoft JhengHei'">ClassCastException</text><line x1="234.5" y1="386.145" x2="382.648" y2="386.145" style="stroke:#555;stroke-width:0.5;"/><text x="239.5" y="407.355" fill="#000" font-size="16" textLength="135.008" font-family="'Microsoft JhengHei'">上週 ai-check 看過</text></g><!--class InterruptedException--><g class="entity" data-qualified-name="InterruptedException" id="ent0007" data-source-line="31"><rect x="300.5" y="257.863" width="257.766" height="60.563" fill="#E3ECF8" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="349.766" y="280.074" fill="#000" font-size="16" textLength="159.234" font-family="'Microsoft JhengHei'">InterruptedException</text><line x1="301.5" y1="289.145" x2="557.266" y2="289.145" style="stroke:#555;stroke-width:0.5;"/><text x="306.5" y="310.355" fill="#000" font-size="16" textLength="245.766" font-family="'Microsoft JhengHei'">Thread.join() 宣告可能拋出（B2）</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="41"><path d="M239,451.863 L239,484.863 L221.287,488.863 L239,492.863 L239,525.707 A0,0 0 0 0 239,525.707 L680.25,525.707 A0,0 0 0 0 680.25,525.707 L680.25,461.863 L670.25,451.863 L239,451.863 A0,0 0 0 0 239,451.863" style="stroke:#B39B4D;stroke-width:0.5;" fill="#FFFBEA"/><path d="M670.25,451.863 L670.25,461.863 L680.25,461.863 L670.25,451.863" style="stroke:#B39B4D;stroke-width:0.5;" fill="#FFFBEA"/><text x="245" y="474.074" fill="#000" font-size="16" textLength="189.766" font-family="'Microsoft JhengHei'">NumberFormatException</text><text x="438.766" y="474.074" fill="#000" font-size="16" textLength="27.875" font-weight="700" font-family="'Microsoft JhengHei'">is-a</text><text x="470.641" y="474.074" fill="#000" font-size="16" textLength="194.609" font-family="'Microsoft JhengHei'">IllegalArgumentException</text><text x="245" y="495.355" fill="#000" font-size="16" textLength="224.227" font-family="'Microsoft JhengHei'">→ catch 父類別也會接住子類別</text><text x="245" y="516.637" fill="#000" font-size="16" textLength="132.227" font-family="'Microsoft JhengHei'">→ 兩個 catch 時，</text><text x="377.227" y="516.637" fill="#000" font-size="16" textLength="112" font-weight="700" font-family="'Microsoft JhengHei'">子類別要放前面</text><text x="489.227" y="516.637" fill="#000" font-size="16" textLength="52.359" font-family="'Microsoft JhengHei'">（A3）</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="extension"><polygon points="319.5,155.113,313.5,173.113,325.5,173.113,319.5,155.113" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M319.5,173.113 C319.5,183.75 319.5,180.048 319.5,190.672" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="extension"><polygon points="299.508,222.037,281.447,227.85,288.547,237.524,299.508,222.037" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M284.997,232.687 C265.33,247.121 249.989,258.381 230.366,272.783" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk10" data-link-type="extension"><polygon points="339.676,222.037,350.704,237.476,357.762,227.771,339.676,222.037" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M354.233,232.624 C367.878,242.547 371.824,245.417 388.491,257.539" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk11" data-link-type="extension"><polygon points="195.344,304.207,178.286,312.515,186.682,321.088,195.344,304.207" fill="none" style="stroke:#181818;stroke-width:1;st